name: astrocadet
description: "AstroCadet - Mars outpost survival game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  shared_preferences: ^2.5.6
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1  # أضف هذه الحزمة هنا

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/BaseViewScreen/
    - assets/images/GreenhouseScreen/
    - assets/images/SolarFieldScreen/
    - assets/images/WaterTankScreen/
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/audio/ambience/

  # خط البكسل (Pixelify Sans - رخصة OFL) لكل اللعبة
  fonts:
    - family: PixelifySans
      fonts:
        - asset: assets/fonts/PixelifySans-Regular.ttf
        - asset: assets/fonts/PixelifySans-Bold.ttf
          weight: 700

# أضف هذا الجزء في نهاية الملف بالبطبط:
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo.png"